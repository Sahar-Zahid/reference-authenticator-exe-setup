name: Build Windows Installer

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Reference Authenticator
        working-directory: backend
        shell: bash
        run: |
          pyinstaller --onedir --windowed --name ReferenceAuthenticator \
            --add-data "../frontend;frontend" \
            --collect-all crewai \
            --collect-all litellm \
            --collect-all tiktoken \
            --collect-all tokenizers \
            --collect-all pymupdf \
            --collect-all fitz \
            --collect-all rapidfuzz \
            --collect-all google.genai \
            --collect-all groq \
            --collect-all openpyxl \
            --collect-all openai \
            --hidden-import=tiktoken_ext \
            --hidden-import=tiktoken_ext.openai_public \
            server.py

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Create installer script
        shell: powershell
        run: |
          @"
          [Setup]
          AppName=Reference Authenticator
          AppVersion=1.0
          DefaultDirName={autopf}\Reference Authenticator
          DefaultGroupName=Reference Authenticator
          OutputDir=${{ github.workspace }}\installer
          OutputBaseFilename=ReferenceAuthenticator-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "${{ github.workspace }}\backend\dist\ReferenceAuthenticator\*"
          DestDir: "{app}"
          Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Reference Authenticator"
          Filename: "{app}\ReferenceAuthenticator.exe"

          Name: "{autodesktop}\Reference Authenticator"
          Filename: "{app}\ReferenceAuthenticator.exe"

          [UninstallDelete]
          Type: filesandordirs
          Name: "{app}"
          "@ | Out-File -FilePath installer.iss -Encoding ASCII

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReferenceAuthenticator-Installer
          path: installer/ReferenceAuthenticator-Setup.exe
